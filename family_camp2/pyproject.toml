[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family_camp2"
version = "0.1.0"
description = "Family Camp scheduling engine (CP-SAT and simulated-annealing solvers)"
requires-python = ">=3.11"
# reportlab: pure-Python PDF generation (no external binaries/subprocesses).
# Used to be the optional 'pdf' extra, gating only --pdf-dir - now core,
# since the status report (REQUIREMENTS.md §4.11/FR-108) is generated
# unconditionally on every solve/revalidate run, not opt-in.
dependencies = ["ortools", "reportlab"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
# Only needed for cli.py's 'fetch' subcommand (downloading input data from
# Google Sheets) - not required to run or test the scheduling engine itself.
google = ["gspread"]

[project.scripts]
family_camp2 = "family_camp2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
