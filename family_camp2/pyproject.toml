[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family_camp2"
version = "0.1.0"
description = "Family Camp scheduling engine (CP-SAT and simulated-annealing solvers)"
requires-python = ">=3.11"
# ortools: the CP-SAT solver (solvers/cp_sat.py). reportlab: pure-Python
# PDF generation (no external binaries/subprocesses) - the status report
# (REQUIREMENTS.md §4.11/FR-108) is generated unconditionally on every
# solve/revalidate run. gspread: the 'fetch' subcommand's Google Sheets
# client (io/google_sheets.py).
dependencies = ["gspread", "ortools", "reportlab"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[project.scripts]
family_camp2 = "family_camp2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
