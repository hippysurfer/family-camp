[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family_camp2"
version = "0.1.0"
description = "Family Camp scheduling engine (CP-SAT and simulated-annealing solvers)"
requires-python = ">=3.11"
dependencies = ["ortools"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
# Only needed for fetch_cli.py (downloading input data from Google Sheets) -
# not required to run or test the scheduling engine itself.
google = ["gspread"]

[project.scripts]
family_camp2-fetch = "family_camp2.fetch_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
